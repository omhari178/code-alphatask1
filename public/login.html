<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – SocialConnect</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🔗 SocialConnect</div>
    <div class="auth-subtitle">Connect with the world</div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div id="auth-error" class="auth-error"></div>

    <!-- LOGIN FORM -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="l-email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="l-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="auth-submit" id="login-btn">Login</button>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signup-form" style="display:none" onsubmit="handleSignup(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="s-name" placeholder="om hari rai" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="s-email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="s-password" placeholder="Min 6 characters" minlength="6" required>
      </div>
      <button type="submit" class="auth-submit" id="signup-btn">Create Account</button>
    </form>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.get()) window.location.href = '/';

  function switchTab(tab) {
    document.getElementById('login-form').style.display  = tab === 'login'  ? '' : 'none';
    document.getElementById('signup-form').style.display = tab === 'signup' ? '' : 'none';
    document.getElementById('tab-login').classList.toggle('active',  tab === 'login');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
    document.getElementById('auth-error').classList.remove('show');
  }

  function showError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.classList.add('show');
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.textContent = 'Logging in…'; btn.disabled = true;
    try {
      const data = await API.post('/login', {
        email: document.getElementById('l-email').value.trim(),
        password: document.getElementById('l-password').value
      });
      Auth.set(data.user);
      showToast('Welcome back, ' + data.user.name + '!', 'success');
      setTimeout(() => window.location.href = '/', 600);
    } catch(err) {
      showError(err.message);
      btn.textContent = 'Login'; btn.disabled = false;
    }
  }

  async function handleSignup(e) {
    e.preventDefault();
    const btn = document.getElementById('signup-btn');
    btn.textContent = 'Creating…'; btn.disabled = true;
    try {
      const data = await API.post('/register', {
        name: document.getElementById('s-name').value.trim(),
        email: document.getElementById('s-email').value.trim(),
        password: document.getElementById('s-password').value
      });
      Auth.set(data.user);
      showToast('Account created! Welcome 🎉', 'success');
      setTimeout(() => window.location.href = '/', 600);
    } catch(err) {
      showError(err.message);
      btn.textContent = 'Create Account'; btn.disabled = false;
    }
  }
</script>
</body>
</html>
