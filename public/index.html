<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home – SocialConnect</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<div class="container">

  <!-- CREATE POST -->
  <div class="card create-post" id="create-post-box" style="display:none">
    <div class="create-post-top">
      <div class="create-post-avatar" id="cp-avatar"></div>
      <textarea id="post-content" placeholder="What's on your mind?" rows="2"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
    </div>
    <div class="create-post-actions">
      <input type="text" id="post-image" placeholder="🖼️ Image URL (optional)">
      <button class="btn btn-primary btn-sm" onclick="createPost()">Post</button>
    </div>
  </div>

  <!-- FEED -->
  <div id="feed">
    <div class="loader"><div class="spinner"></div>Loading posts…</div>
  </div>

</div>

<footer>
  <strong>CodeAlpha SocialConnect</strong> &nbsp;|&nbsp;
  Developed by <strong>om hari rai</strong> &nbsp;|&nbsp;
  Kalinga University &nbsp;|&nbsp;
  <a href="mailto:o95126571@gmail.com">o95126571@gmail.com</a> &nbsp;|&nbsp;
  +91-0000000000
</footer>

<script src="/js/app.js"></script>
<script>
  const user = Auth.get();
  renderNavbar('home');

  // Show create post box if logged in
  if (user) {
    const box = document.getElementById('create-post-box');
    box.style.display = '';
    const av = document.getElementById('cp-avatar');
    av.innerHTML = user.avatar ? `<img src="${user.avatar}">` : initials(user.name);
  }

  async function loadFeed() {
    try {
      const posts = await API.get('/posts');
      const feed = document.getElementById('feed');
      if (!posts.length) {
        feed.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><p>No posts yet. Be the first to post!</p></div>`;
        return;
      }
      feed.innerHTML = posts.map(p => buildPostCard(p, user)).join('');
    } catch(e) {
      document.getElementById('feed').innerHTML = `<div class="empty-state"><p>Failed to load posts.</p></div>`;
    }
  }

  async function createPost() {
    if (!user) return showToast('Please login first', 'error');
    const content = document.getElementById('post-content').value.trim();
    const imageUrl = document.getElementById('post-image').value.trim();
    if (!content) return showToast('Write something first!', 'error');
    try {
      const post = await API.post('/posts', { userEmail: user.email, userName: user.name, content, imageUrl });
      document.getElementById('post-content').value = '';
      document.getElementById('post-image').value = '';
      document.getElementById('post-content').style.height = 'auto';
      const feed = document.getElementById('feed');
      const emptyState = feed.querySelector('.empty-state');
      if (emptyState) feed.innerHTML = '';
      feed.insertAdjacentHTML('afterbegin', buildPostCard(post, user));
      showToast('Post shared! 🎉', 'success');
    } catch(e) { showToast(e.message, 'error'); }
  }

  loadFeed();
</script>
</body>
</html>
